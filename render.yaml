services:
  - type: web
    name: remote-phone-control-signaling
    runtime: python
    plan: free
    buildCommand: pip install -r signaling_server/requirements.txt
    startCommand: python signaling_server/server.py
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_TTL_SEC
        value: "86400"
      - key: DATABASE_URL
        sync: false
